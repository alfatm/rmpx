name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects stable with rustfmt and clippy; `just msrv` needs the oldest supported Rust too
      - run: rustup show && rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-sort,cargo-machete
      - run: cargo install --locked cargo-workspace-lints
      - run: just lint
      - run: just test
